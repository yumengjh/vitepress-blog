name: Triggered by private repo

on:
  repository_dispatch:
    types: [build-triggered]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ✅ 收到私有仓库触发信号
        run: echo "开始执行任务"

      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install

      - name: 执行 pull 操作
        run: npm run pull
        env:
          VITE_GITHUB_TOKEN: ${{ secrets.VITE_GITHUB_TOKEN }}

      - name: 执行构建
        run: npm run build
        env:
          VITE_ALGOLIA_APP_ID: ${{ secrets.VITE_ALGOLIA_APP_ID }}
          VITE_ALGOLIA_API_KEY: ${{ secrets.VITE_ALGOLIA_API_KEY }}
          VITE_ALGOLIA_INDEX_NAME: ${{ secrets.VITE_ALGOLIA_INDEX_NAME }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_AUTH_SECRET_KEY: ${{ secrets.VITE_AUTH_SECRET_KEY }}
          VITE_TWIKOO_ENV_ID: ${{  secrets.VITE_TWIKOO_ENV_ID}}
  
      - name: 上传至服务器
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTPADDRESS }}
          username: ${{ secrets.FTPACCOUNT }}
          password: ${{ secrets.FTPPASSWORD }}
          local-dir: .vitepress/dist/
          server-dir: /
          dangerous-clean-slate: false
          dry-run: false
          state-name: deploy-state.json  
